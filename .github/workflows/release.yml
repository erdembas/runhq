name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release (${{ matrix.platform }}${{ matrix.args && format(' {0}', matrix.args) || '' }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/runhq-core -> target
            apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS builds rely on the ad-hoc `signingIdentity: "-"` from
          # tauri.conf.json — see docs/RELEASING.md for the full strategy.
          # DO NOT set APPLE_* env vars here unconditionally: tauri-action
          # treats any non-empty value as "a real Developer ID cert is
          # present" and crashes `security import` if the secret is blank.
          # To enable notarization later, gate the APPLE_* block behind an
          # `if: env.APPLE_CERTIFICATE != ''` runner step, or split it into
          # a conditional job — never pipe empty secrets straight to env.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RunHQ ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install RunHQ.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Publish version-less aliases for the Linux artefacts so the
      # `https://github.com/erdembas/runhq/releases/latest/download/<name>`
      # redirect always resolves to a real binary. tauri-action names
      # the bundles `RunHQ_<version>_amd64.{deb,AppImage}`; without
      # these stable aliases the docs install snippet 302s onto the
      # release HTML page and `curl -L` writes the HTML to disk
      # (which dpkg then rejects with "unexpected end of file in
      # archive magic version number").
      - name: Publish stable Linux asset aliases
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deb_src=$(find apps/desktop/src-tauri/target/release/bundle/deb \
            -maxdepth 1 -name 'RunHQ_*_amd64.deb' -print -quit)
          if [ -z "$deb_src" ]; then
            echo "::error::No .deb produced under target/release/bundle/deb/"
            exit 1
          fi
          cp "$deb_src" runhq_amd64.deb
          uploads=(runhq_amd64.deb)

          appimage_src=$(find apps/desktop/src-tauri/target/release/bundle/appimage \
            -maxdepth 1 -name 'RunHQ_*_amd64.AppImage' -print -quit 2>/dev/null || true)
          if [ -n "$appimage_src" ]; then
            cp "$appimage_src" runhq_amd64.AppImage
            uploads+=(runhq_amd64.AppImage)
          fi

          # `--clobber` is required because tauri-action drafted the
          # release in an earlier step; on retries the alias may
          # already exist.
          gh release upload "${{ github.ref_name }}" "${uploads[@]}" \
            --clobber --repo "${{ github.repository }}"

  # Sync the Homebrew Cask only after every matrix job has uploaded its
  # DMGs. Running this as a `release: published` trigger races the Tauri
  # build and 404s on the download URLs (see docs/RELEASING.md).
  homebrew:
    name: Update Homebrew Cask
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
