name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild (e.g. v3.1.0).'
        required: true
        type: string
      family:
        description: 'Rebuild only this platform family; all release assets are still verified.'
        required: true
        default: all
        type: choice
        options: [all, macos, linux, windows]

# Bundled Monaco language workers exceed Node's default ~2 GB heap on macOS.
# Job-wide inheritance also covers Tauri's beforeBuildCommand.
env:
  NODE_OPTIONS: --max-old-space-size=4096

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release source and platforms
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      # Use the workflow revision's helpers, including when repairing an older tag.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select platforms
        id: plan
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_FAMILY: ${{ inputs.family || 'all' }}
        run: node scripts/release-plan.mjs
      - name: Resolve the original tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.plan.outputs.tag }}
          path: release-source
      - name: Validate versions and pin the source commit
        id: source
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.tag }}
        run: |
          node scripts/release-plan.mjs --check-version release-source
          echo "commit=$(git -C release-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: Release (${{ matrix.family }} ${{ matrix.arch }})
    needs: prepare
    permissions:
      contents: write
    # Every matrix entry is now treated as required. Earlier releases
    # gated ARM builds behind `continue-on-error` while we shook the
    # toolchain out, but that masked a missing-`xdg-open` regression
    # on `ubuntu-22.04-arm` for v0.10.0 — the entire Linux ARM64
    # build (.deb / .rpm / .AppImage) silently dropped from the
    # release. Failing loudly is the right default; if a future ARM
    # toolchain regression really does need a soft-fail, re-introduce
    # `continue-on-error` per-entry rather than blanket-applying it.
    # `secrets.X` cannot be referenced inside `if:` conditions on
    # individual steps, so we surface "is a Developer ID cert present?"
    # as a job-level boolean string ('true' / 'false') and gate the
    # notarized macOS branch off it below. The value itself never
    # leaks the secret — only its presence.
    env:
      APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install Linux dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          # `xdg-utils` ships `xdg-open`, which tauri-bundler embeds into
          # the AppImage runtime. The x86 ubuntu-22.04 runner image
          # pre-installs it, but `ubuntu-22.04-arm` does not — without
          # this line the AppImage step crashes with `xdg-open binary
          # not found /usr/bin/xdg-open` and takes the whole job (and
          # the .deb / .rpm artifacts produced earlier in the same
          # bundle pass) down with it. `file` and `libfuse2` are
          # belt-and-suspenders for AppImage runtime introspection and
          # the FUSE-based `--appimage-extract-and-run` self-test.
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev \
            xdg-utils file libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key is implicitly partitioned by runner OS + matrix
          # entry, so x64 and ARM64 windows-latest jobs don't share a
          # `target/` directory and avoid clobbering each other's
          # incremental artefacts.
          workspaces: |
            crates/runhq-core -> target
            apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ─── macOS notarized build ─────────────────────────────────
      # Active only when every required APPLE_* secret is populated
      # (the `APPLE_CERT_PRESENT` job-level env is the gate). The
      # ad-hoc `signingIdentity: "-"` from tauri.conf.json would
      # otherwise trump APPLE_SIGNING_IDENTITY at bundle time, so we
      # override it inline via `--config` and let tauri-action's env
      # vars drive the real Developer ID Application identity, the
      # hardened-runtime signature, and `notarytool submit ...
      # --staple` against Apple. See docs/RELEASING.md for the full
      # secret list and a recovery checklist.
      - name: Build (macOS, notarized)
        if: matrix.family == 'macos' && env.APPLE_CERT_PRESENT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'RunHQ ${{ needs.prepare.outputs.tag }}'
          releaseBody: 'See the assets below to download and install RunHQ.'
          releaseDraft: true
          prerelease: false
          # `--config '{"bundle":{"macOS":{"signingIdentity":null}}}'`
          # nulls out the on-disk ad-hoc identity so tauri-bundler
          # honours APPLE_SIGNING_IDENTITY instead. Tauri 2.x merges
          # this JSON over the on-disk config; the Linux/Windows
          # branches and the unsigned macOS branch leave the file
          # untouched.
          args: ${{ matrix.args }} --config '{"bundle":{"macOS":{"signingIdentity":null}}}'

      # ─── Default build (Linux, Windows, ad-hoc macOS) ─────────
      # Runs whenever the platform isn't macOS or the Apple secrets
      # aren't set. macOS without secrets keeps shipping the ad-hoc
      # signed `.app` (sealed bundle, brew postflight strips
      # quarantine) — see docs/RELEASING.md → "macOS Code Signing
      # Strategy" for why that's still a sane fallback.
      - name: Build (default — Linux / Windows / ad-hoc macOS)
        if: matrix.family != 'macos' || env.APPLE_CERT_PRESENT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: 'RunHQ ${{ needs.prepare.outputs.tag }}'
          releaseBody: 'See the assets below to download and install RunHQ.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Stable names power the website's latest/download fallback links.
      # The helper requires every format and handles Cargo workspace paths.
      - name: Publish stable asset aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          FAMILY: ${{ matrix.family }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: bash scripts/publish-release-aliases.sh

  verify:
    name: Verify release assets and updater
    needs: [prepare, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify complete published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          verification_dir="$RUNNER_TEMP/release-verification"
          mkdir -p "$verification_dir"
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" \
            --json tagName,isDraft,isPrerelease,assets > "$verification_dir/release.json"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" \
            --pattern latest.json --dir "$verification_dir" --clobber
          node scripts/verify-release.mjs \
            "$verification_dir/release.json" "$verification_dir/latest.json" \
            "$RELEASE_TAG" "$GH_REPO"

  # Sync the Homebrew Cask only after every matrix job has uploaded its
  # DMGs and the full release has passed verification. A published trigger races the Tauri
  # build and 404s on the download URLs (see docs/RELEASING.md).
  homebrew:
    name: Update Homebrew Cask
    needs: [prepare, verify]
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
