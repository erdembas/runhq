name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release (${{ matrix.family }} ${{ matrix.arch }})
    permissions:
      contents: write
    # ARM jobs are marked experimental: true so the rest of the matrix
    # still ships even if a brand-new ARM toolchain regression breaks
    # one of them. Once they have shipped cleanly across two releases
    # we should drop the flag and treat them as required.
    continue-on-error: ${{ matrix.experimental == true }}
    # `secrets.X` cannot be referenced inside `if:` conditions on
    # individual steps, so we surface "is a Developer ID cert present?"
    # as a job-level boolean string ('true' / 'false') and gate the
    # notarized macOS branch off it below. The value itself never
    # leaks the secret — only its presence.
    env:
      APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── macOS ─────────────────────────────────────────────────
          - platform: macos-latest
            family: macos
            arch: aarch64
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            family: macos
            arch: x64
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

          # ── Linux ─────────────────────────────────────────────────
          - platform: ubuntu-22.04
            family: linux
            arch: amd64
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: ubuntu-22.04-arm
            family: linux
            arch: arm64
            target: aarch64-unknown-linux-gnu
            args: ''
            experimental: true

          # ── Windows ───────────────────────────────────────────────
          - platform: windows-latest
            family: windows
            arch: x64
            target: x86_64-pc-windows-msvc
            args: ''
          # ARM64 is cross-compiled on the x64 Windows runner via the
          # MSVC ARM64 toolchain. tauri-bundler picks up `--target` and
          # produces NSIS + MSI installers that boot natively on ARM
          # Windows hosts. Cross-compile keeps us off the
          # `windows-11-arm` runner pool, which still has spotty
          # availability for free public-repo minutes.
          - platform: windows-latest
            family: windows
            arch: arm64
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc
            experimental: true

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.family == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key is implicitly partitioned by runner OS + matrix
          # entry, so x64 and ARM64 windows-latest jobs don't share a
          # `target/` directory and avoid clobbering each other's
          # incremental artefacts.
          workspaces: |
            crates/runhq-core -> target
            apps/desktop/src-tauri -> target

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # ─── macOS notarized build ─────────────────────────────────
      # Active only when every required APPLE_* secret is populated
      # (the `APPLE_CERT_PRESENT` job-level env is the gate). The
      # ad-hoc `signingIdentity: "-"` from tauri.conf.json would
      # otherwise trump APPLE_SIGNING_IDENTITY at bundle time, so we
      # override it inline via `--config` and let tauri-action's env
      # vars drive the real Developer ID Application identity, the
      # hardened-runtime signature, and `notarytool submit ...
      # --staple` against Apple. See docs/RELEASING.md for the full
      # secret list and a recovery checklist.
      - name: Build (macOS, notarized)
        if: matrix.family == 'macos' && env.APPLE_CERT_PRESENT == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RunHQ ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install RunHQ.'
          releaseDraft: true
          prerelease: false
          # `--config '{"bundle":{"macOS":{"signingIdentity":null}}}'`
          # nulls out the on-disk ad-hoc identity so tauri-bundler
          # honours APPLE_SIGNING_IDENTITY instead. Tauri 2.x merges
          # this JSON over the on-disk config; the Linux/Windows
          # branches and the unsigned macOS branch leave the file
          # untouched.
          args: ${{ matrix.args }} --config '{"bundle":{"macOS":{"signingIdentity":null}}}'

      # ─── Default build (Linux, Windows, ad-hoc macOS) ─────────
      # Runs whenever the platform isn't macOS or the Apple secrets
      # aren't set. macOS without secrets keeps shipping the ad-hoc
      # signed `.app` (sealed bundle, brew postflight strips
      # quarantine) — see docs/RELEASING.md → "macOS Code Signing
      # Strategy" for why that's still a sane fallback.
      - name: Build (default — Linux / Windows / ad-hoc macOS)
        if: matrix.family != 'macos' || env.APPLE_CERT_PRESENT != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RunHQ ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install RunHQ.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Publish version-less aliases (e.g. `runhq_amd64.deb`,
      # `runhq_arm64-setup.exe`, `runhq_aarch64.dmg`) alongside the
      # `tauri-action`-produced versioned bundles. The docs install
      # snippets and the auto-detect on docs/index.html point at these
      # stable names through the
      # `https://github.com/erdembas/runhq/releases/latest/download/<name>`
      # redirect — without the alias the redirect 404s onto an HTML
      # page and curl writes that HTML to disk under the binary name,
      # which dpkg/msiexec/Finder then reject with "magic number"
      # errors.
      - name: Publish stable asset aliases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAMILY: ${{ matrix.family }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          # When `--target <triple>` is passed, tauri writes bundles
          # under `target/<triple>/release/bundle/<format>/`. With no
          # explicit target it falls back to `target/release/...`.
          # Probe both so the script doesn't have to care.
          bundle_a="apps/desktop/src-tauri/target/${TARGET}/release/bundle"
          bundle_b="apps/desktop/src-tauri/target/release/bundle"

          find_first() {
            local subdir=$1
            local glob=$2
            for root in "$bundle_a" "$bundle_b"; do
              if [ -d "$root/$subdir" ]; then
                local hit
                hit=$(find "$root/$subdir" -maxdepth 1 -name "$glob" -print -quit 2>/dev/null || true)
                if [ -n "$hit" ]; then
                  printf '%s' "$hit"
                  return
                fi
              fi
            done
          }

          uploads=()

          case "$FAMILY" in
            linux)
              # AppImage uses the AppImage-native arch suffix
              # (`amd64`/`aarch64`) while .deb follows Debian's
              # (`amd64`/`arm64`); we surface both as `runhq_<arch>.*`
              # using Debian's vocabulary because that's what dpkg
              # users grep for.
              if [ "$ARCH" = "amd64" ]; then
                deb_glob='RunHQ_*_amd64.deb'
                appimage_glob='RunHQ_*_amd64.AppImage'
              else
                deb_glob='RunHQ_*_arm64.deb'
                appimage_glob='RunHQ_*_aarch64.AppImage'
              fi
              deb_src=$(find_first deb "$deb_glob")
              if [ -n "$deb_src" ]; then
                cp "$deb_src" "runhq_${ARCH}.deb"
                uploads+=("runhq_${ARCH}.deb")
              fi
              appimage_src=$(find_first appimage "$appimage_glob")
              if [ -n "$appimage_src" ]; then
                cp "$appimage_src" "runhq_${ARCH}.AppImage"
                uploads+=("runhq_${ARCH}.AppImage")
              fi
              ;;
            windows)
              # NSIS produces `RunHQ_<v>_<arch>-setup.exe`; WiX
              # produces `RunHQ_<v>_<arch>_<lang>.msi` where lang
              # defaults to en-US. We expose the NSIS installer as the
              # primary `runhq_<arch>-setup.exe` (winget/Cask updaters
              # follow this filename), and the MSI as a fallback.
              nsis_src=$(find_first nsis "RunHQ_*_${ARCH}-setup.exe")
              if [ -n "$nsis_src" ]; then
                cp "$nsis_src" "runhq_${ARCH}-setup.exe"
                uploads+=("runhq_${ARCH}-setup.exe")
              fi
              msi_src=$(find_first msi "RunHQ_*_${ARCH}_*.msi")
              if [ -n "$msi_src" ]; then
                cp "$msi_src" "runhq_${ARCH}.msi"
                uploads+=("runhq_${ARCH}.msi")
              fi
              ;;
            macos)
              # DMGs ship as `RunHQ_<v>_<arch>.dmg` where <arch> is
              # `aarch64` or `x64`; we mirror that vocabulary in the
              # alias so the docs auto-detect doesn't have to remap.
              if [ "$ARCH" = "aarch64" ]; then
                dmg_glob='RunHQ_*_aarch64.dmg'
              else
                dmg_glob='RunHQ_*_x64.dmg'
              fi
              dmg_src=$(find_first dmg "$dmg_glob")
              if [ -n "$dmg_src" ]; then
                cp "$dmg_src" "runhq_${ARCH}.dmg"
                uploads+=("runhq_${ARCH}.dmg")
              fi
              ;;
          esac

          if [ "${#uploads[@]}" -eq 0 ]; then
            echo "::warning::No bundles found to alias for ${FAMILY}/${ARCH}"
            exit 0
          fi

          # `--clobber` is required because tauri-action drafted the
          # release in an earlier step and on retries the alias may
          # already exist.
          gh release upload "${{ github.ref_name }}" "${uploads[@]}" \
            --clobber --repo "${{ github.repository }}"

  # Sync the Homebrew Cask only after every matrix job has uploaded its
  # DMGs. Running this as a `release: published` trigger races the Tauri
  # build and 404s on the download URLs (see docs/RELEASING.md).
  homebrew:
    name: Update Homebrew Cask
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/homebrew-tap.yml
    with:
      tag: ${{ github.ref_name }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
