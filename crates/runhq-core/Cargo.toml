[package]
name = "runhq-core"
version = "0.9.0" # x-release-please-version
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/erdembas/runhq"
description = "Core domain logic for RunHQ: process supervision, port inspection, project scanning, persisted state."

[lib]
name = "runhq_core"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
thiserror = "2"

uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }

dirs = "5"
sysinfo = "0.32"
listeners = "0.5"

tracing = "0.1"
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }

# `rustls-tls` keeps us off OpenSSL on every platform — no system-library
# coupling, no `pkg-config` build hassle on Windows, identical bundled
# binaries across CI runners. The default-features off + json + rustls
# combo is the smallest reqwest footprint that still gives us serde
# JSON helpers.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Token counting for the chat composer's "context length" meter.
# tiktoken-rs ships with the OpenAI BPE tables (cl100k_base, o200k_base,
# r50k_base) baked in — accurate for the OpenAI family and a reasonable
# proxy for any model that doesn't expose its own tokenizer (Anthropic,
# Gemini, llama.cpp). We pick `cl100k_base` as the default and degrade
# gracefully to a char-based approximation if the BPE init ever fails
# at runtime, so the meter is best-effort and never blocks send.
tiktoken-rs = "0.9"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal"] }

# Windows process-tree containment via Job Objects. The `Win32_System_*`
# features pull in CreateJobObjectW, AssignProcessToJobObject, and
# OpenProcess — exactly what `process_group::JobObject` needs to attach
# kill-on-close semantics to spawned shells. Win32_Foundation gives us
# CloseHandle. Pinned to 0.61 to match the version Tauri's transitive
# tree already resolves to, avoiding duplicate `windows-*` crates in the
# final binary.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.41", features = ["macros", "rt-multi-thread"] }
